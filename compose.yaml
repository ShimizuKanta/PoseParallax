services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - game-data:/app/data
    expose:
      - "8000"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      POSE_HOST: ${POSE_HOST:?Set POSE_HOST to the hostname on your TLS certificate}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  game-data:
  caddy-data:
  caddy-config:
